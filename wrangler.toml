name = "regles-appartement"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Le dossier public est servi tel quel par Cloudflare ; le Worker ne voit
# que ce qui n'y correspond pas (les routes /api et /photos).
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# Le moteur se reveille chaque minute pour creer les taches du jour
# et envoyer le rappel du soir.
[triggers]
crons = ["* * * * *"]

# Ces identifiants ne sont pas des secrets : ils ne servent a rien sans les
# droits sur le compte. `npm run deploy` les reecrit si besoin. Les variantes
# "preview" servent au developpement local : sans elles, `wrangler dev`
# s'invente des identifiants et les reecrit ici.
[[d1_databases]]
binding = "DB"
database_name = "regles"
database_id = "d07eabc4-677d-4bf3-badb-9b428eb23369"
preview_database_id = "regles-local"

[[kv_namespaces]]
binding = "PHOTOS"
id = "0430725f6f3e400ebd00175fe615b699"
preview_id = "photos-local"

[vars]
USERS = "jerome:Jerome:android,laurine:Laurine:ios"
TIMEZONE = "Europe/Paris"
MENAGE_DAY = "6"
MACHINE_MINUTES = "120"
LINGE_SEC_HOURS = "6"

# Les cles VAPID et le code d'acces sont des secrets, jamais dans ce fichier :
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put VAPID_SUBJECT
#   npx wrangler secret put APP_PIN
